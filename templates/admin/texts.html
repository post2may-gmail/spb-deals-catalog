{% extends "admin/base.html" %}
{% block title %}Тексты{% endblock %}
{% block content %}
<section class="admin-card">
  <h1>Тексты сайта</h1>
  <form method="post" action="/admin/texts" class="admin-form">
    {% include "admin/_csrf.html" %}
    {% for f in fields %}
    <label class="field">
      <span>{{ f.label }}</span>
      {% if f.key in ['default_description', 'hero_lead', 'catalog_section_lead'] %}
      <textarea name="{{ f.key }}" rows="3">{{ f.value }}</textarea>
      {% else %}
      <input type="text" name="{{ f.key }}" value="{{ f.value }}">
      {% endif %}
    </label>
    {% endfor %}
    <button class="btn-primary" type="submit">Сохранить</button>
  </form>
</section>
{% endblock %}
