{% extends "base.html" %}
{% block content %}
<section class="page-head">
  <nav class="breadcrumbs" aria-label="Хлебные крошки">
    <a href="/">Главная</a>
    <span aria-hidden="true">/</span>
    <span>Каталог улиц</span>
  </nav>
  <h1>Каталог улиц Санкт-Петербурга</h1>
  <p class="section-lead">Выберите букву, затем улицу — откроется страница со сделками по данным Росреестра.</p>
  <div class="alpha-grid" role="navigation" aria-label="Алфавит улиц">
    {% for item in letters %}
    <a class="alpha-cell" href="/catalog/{{ item.letter|urlencode }}">
      <span class="alpha-letter">{{ item.letter }}</span>
      <span class="alpha-meta">{{ item.streets_count }} ул.</span>
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
