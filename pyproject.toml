[project]
name = "spb-deals"
version = "0.1.0"
description = "Цены сделок на жилье в Санкт-Петербурге"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "httpx>=0.27.0",
  "jinja2>=3.1.6",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "itsdangerous>=2.2.0",
  "starlette>=0.40.0",
  "bleach>=6.2.0",
  "bcrypt>=4.2.0",
]

[tool.vercel]
entrypoint = "main:app"
